<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Task Manager</title>
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>

        <form id="task-form">
            <input type="text" id="task-input" class="input-field" placeholder="Enter a new task" required>
            <button type="submit" class="add-button">+</button>
        </form>

        <ul id="task-list"></ul>
    </div>

    <script src="./script.js" defer></script>
</body>
</html>
